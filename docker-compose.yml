services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/data
    env_file:
      - .env
    environment:
      - DATABASE_PATH=/data/rocketgrowth.db
      - WORKER_SERVER_URL=http://worker:8100
    depends_on:
      - worker

  worker:
    build:
      context: ./workers
      dockerfile: Dockerfile
    ports:
      - "8100:8100"
    volumes:
      - ./data:/data
    environment:
      - WORKER_PORT=8100

volumes:
  data:
